# Render Blueprint — repo root, no rootDir. Free web service + free Postgres.
services:
  - type: web
    name: network-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: network-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
databases:
  - name: network-db
    plan: free
