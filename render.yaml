# Render Blueprint (repo root). Free web service + free Postgres. Migrations run on every start.
# Secrets are never stored here: values marked sync:false are typed into the Render dashboard.
services:
  - type: web
    name: network-app
    runtime: python
    plan: free
    numInstances: 1  # default realtime hub is in-process; set REALTIME_BACKEND=postgres before scaling out
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: network-db
          property: connectionString
      - key: STORAGE_BACKEND
        value: db
      - key: ADMIN_USERNAMES
        sync: false
      - key: HELIUS_API_KEY
        sync: false
      - key: SOLANA_RPC_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: EXTENSION_ORIGINS
        sync: false
      - key: ENABLE_GOOGLE_RECOVERY
        value: "0"
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false
      # Public sign-in with X only
      - key: PUBLIC_BASE_URL
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: ENABLE_WALLET_FEATURES
        value: "0"
      - key: REALTIME_BACKEND
        value: local
databases:
  - name: network-db
    plan: free
